name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  api:
    name: API (build, test, contract)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ultrakil
          POSTGRES_PASSWORD: ultrakil_ci
          POSTGRES_DB: ultrakil_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ultrakil -d ultrakil_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://ultrakil:ultrakil_ci@localhost:5432/ultrakil_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SCHEDULER_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup errors out when the
      # version is given both in the workflow and in package.json's
      # "packageManager" field, so package.json stays the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @ultrakil/api prisma:generate

      - name: Typecheck
        run: pnpm --filter @ultrakil/api typecheck

      - name: Lint
        run: pnpm --filter @ultrakil/api lint

      - name: Migrate empty database
        run: pnpm --filter @ultrakil/api db:deploy

      - name: Unit tests
        run: pnpm --filter @ultrakil/api test

      - name: Integration tests (database, seed, health)
        run: pnpm --filter @ultrakil/api test:integration

      - name: Build
        run: pnpm --filter @ultrakil/api build

      - name: OpenAPI contract is up to date
        run: |
          pnpm --filter @ultrakil/api openapi:generate
          git diff --exit-code -- packages/api-contracts/openapi/openapi.json \
            || (echo "::error::OpenAPI contract is stale. Run 'pnpm contracts:generate' and commit the result." && exit 1)

      - name: Generate TypeScript client
        run: pnpm --filter @ultrakil/api-contracts generate

      - name: Generated client is up to date
        run: |
          git diff --exit-code -- packages/api-contracts/src/generated \
            || (echo "::error::Generated API client is stale. Run 'pnpm contracts:generate' and commit the result." && exit 1)

  scheduler:
    name: Scheduler service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scheduler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if a .env file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is committed. Remove it and rotate any exposed credentials."
            exit 1
          fi
          tracked=$(git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files are committed: $tracked"
            exit 1
          fi
          echo "No environment files tracked."
      - name: Fail if the real workforce workbook is tracked
        run: |
          tracked=$(git ls-files -- 'data/*.xlsx' 'data/*.xls' 'data/*.csv' 'data/matrix-mapping.json' 'data/job-types.json' | grep -v 'example' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Real workforce data is committed: $tracked"
            exit 1
          fi
          echo "No real workforce data tracked."
