[project]
name = "ultrakil-scheduler"
version = "0.1.0"
description = "UltraKIL scheduling service — constraint solving for visit assignment"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
