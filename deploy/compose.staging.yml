name: ${COMPOSE_PROJECT_NAME:-ultrakil-staging}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-runtime: &runtime
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  pids_limit: 256
  logging: *default-logging

x-release-env: &release-env
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD}
  SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:?Set SEED_ADMIN_NAME}
  NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL}
  API_CORS_ORIGINS: ${API_CORS_ORIGINS:?Set API_CORS_ORIGINS}

services:
  postgres:
    image: postgres:16.15-alpine3.23
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7.4.11-alpine3.21
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  scheduler:
    <<: *runtime
    build:
      context: ../services/scheduler
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-1280m}
    cpus: 1.5
    stop_grace_period: 180s
    environment:
      # This scheduler is private on the internal backend network. Public
      # deployments must leave the opt-out unset and provide a shared token.
      SCHEDULER_ALLOW_UNAUTHENTICATED: "true"
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  migrate:
    <<: *runtime
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: tooling
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    environment: *release-env
    command: ["node", "deploy/staging-tool.mjs", "migrate"]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  import:
    <<: *runtime
    profiles: [tools]
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: tooling
    restart: "no"
    user: "${IMPORT_UID:-1000}:${IMPORT_GID:-1000}"
    mem_limit: 768m
    cpus: 1.0
    environment:
      <<: *release-env
      TECHNICIAN_MATRIX_PATH: /import/technician-matrix.xlsx
      MASTER_SCHEDULE_PATH: /import/master-schedule-2026.xlsx
      MATRIX_MAPPING_PATH: /import-config/matrix-mapping.json
      STAGING_REPORT_DIR: /reports
    command: ["node", "deploy/staging-tool.mjs", "import", "--dry-run"]
    volumes:
      - type: bind
        source: ${IMPORT_DIR:?Set IMPORT_DIR}/technician-matrix.xlsx
        target: /import/technician-matrix.xlsx
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${IMPORT_DIR:?Set IMPORT_DIR}/master-schedule-2026.xlsx
        target: /import/master-schedule-2026.xlsx
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${IMPORT_CONFIG_DIR:?Set IMPORT_CONFIG_DIR}
        target: /import-config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${IMPORT_REPORT_DIR:?Set IMPORT_REPORT_DIR}
        target: /reports
        bind: {create_host_path: false}
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *runtime
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: runtime
    restart: unless-stopped
    mem_limit: 640m
    cpus: 1.0
    stop_grace_period: 180s
    environment:
      NODE_ENV: production
      TZ: Asia/Colombo
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BULLMQ_PREFIX: ${COMPOSE_PROJECT_NAME:-ultrakil-staging}
      API_PORT: 3001
      API_GLOBAL_PREFIX: api
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
      HEALTH_PROBE_TIMEOUT_MS: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 12h
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SCHEDULER_BASE_URL: http://scheduler:8000
      SCHEDULER_HEALTH_TIMEOUT_MS: 3000
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"
    networks: [backend, ingress]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  web:
    <<: *runtime
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.75
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /workspace/apps/manager-web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks: [ingress]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  backup:
    <<: *runtime
    build:
      context: ..
      dockerfile: deploy/recovery.Dockerfile
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-93600}
    command: ["schedule"]
    volumes:
      - type: bind
        source: ${BACKUP_DIR:?Set BACKUP_DIR}
        target: /backups
        bind: {create_host_path: false}
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "/opt/ultrakil/recovery.py", "health"]
      interval: 5m
      timeout: 60s
      retries: 1
      start_period: 5m
    logging: *default-logging

  backup-export:
    <<: *runtime
    profiles: [offhost]
    build:
      context: ..
      dockerfile: deploy/recovery.Dockerfile
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    command: ["export"]
    environment:
      EXPORT_AGE_RECIPIENT: ${EXPORT_AGE_RECIPIENT:-}
      EXPORT_SSH_HOST: ${EXPORT_SSH_HOST:-}
      EXPORT_SSH_PORT: ${EXPORT_SSH_PORT:-22}
      EXPORT_SSH_USER: ${EXPORT_SSH_USER:-}
      EXPORT_REMOTE_DIR: ${EXPORT_REMOTE_DIR:-}
      EXPORT_WORK_DIR: /export-work
    volumes:
      - type: bind
        source: ${BACKUP_DIR:?Set BACKUP_DIR}
        target: /backups
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${EXPORT_WORK_DIR:-/opt/ultrakil/export-work}
        target: /export-work
        bind: {create_host_path: false}
      - type: bind
        source: ${EXPORT_SSH_KEY_PATH:-/opt/ultrakil/export-secrets/ssh-key}
        target: /export-secrets/ssh-key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${EXPORT_KNOWN_HOSTS_PATH:-/opt/ultrakil/export-secrets/known-hosts}
        target: /export-secrets/known-hosts
        read_only: true
        bind: {create_host_path: false}
    networks: [export-egress]

networks:
  backend:
    internal: true
  ingress:
    driver: bridge
    internal: false
  export-egress: {}

volumes:
  postgres_data:
  redis_data:
