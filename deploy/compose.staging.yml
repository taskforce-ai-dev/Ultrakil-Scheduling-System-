name: ultrakil-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  scheduler:
    build:
      context: ../services/scheduler
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Colombo
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BULLMQ_PREFIX: ultrakil-staging
      API_PORT: 3001
      API_GLOBAL_PREFIX: api
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
      HEALTH_PROBE_TIMEOUT_MS: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 12h
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SCHEDULER_BASE_URL: http://scheduler:8000
      SCHEDULER_HEALTH_TIMEOUT_MS: 3000
      TECHNICIAN_MATRIX_PATH: /import/technician-matrix.xlsx
      MASTER_SCHEDULE_PATH: /import/master-schedule-2026.xlsx
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"
    volumes:
      - ${IMPORT_DIR}:/import:ro
      - import_reports:/workspace/data
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    command:
      - sh
      - -ec
      - |
        while true; do
          target="/backups/ultrakil-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          pg_dump --no-owner --no-acl | gzip > "$$target"
          gzip -t "$$target"
          find /backups -type f -name 'ultrakil-*.sql.gz' -mtime "+$$BACKUP_RETENTION_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    volumes:
      - postgres_backups:/backups
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

networks:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  postgres_backups:
  import_reports:
